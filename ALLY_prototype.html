<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ALLY prototype</title>
<style>
:root{--bg:#FAF6EF;--card:#fff;--ink:#2C2C2A;--mute:#6F6D66;--line:#E4DFD3;--teal:#0F6E56;--tx:#E1F5EE;--cor:#F0997B;--cx:#FAECE7;--sun:#FAC775;--sx:#FAEEDA;--plum:#3C3489;--px:#EEEDFE;--warn:#993C1D;--cr:#FFF4EC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181d;--card:#22242b;--ink:#EDEBE4;--mute:#A9A79F;--line:#34363f;--tx:#12332b;--cx:#3a2620;--sx:#3a3020;--px:#26244a;--warn:#F5B39C;--cr:#2a1f1b;--plum:#B9B4F5}}
:root[data-theme="dark"]{--bg:#17181d;--card:#22242b;--ink:#EDEBE4;--mute:#A9A79F;--line:#34363f;--tx:#12332b;--cx:#3a2620;--sx:#3a3020;--px:#26244a;--warn:#F5B39C;--cr:#2a1f1b;--plum:#B9B4F5}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.scr{flex:1;overflow-y:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}.top h1{font-size:17px;margin:0;flex:1;color:var(--plum)}
.proto{font-size:10px;text-align:center;background:var(--sx);color:var(--mute);padding:3px}
.pill{border:1.5px solid var(--cor);color:var(--warn);background:none;border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;background:var(--teal);color:#fff;margin:8px 0;cursor:pointer;text-align:center;text-decoration:none}
.btn.o{background:none;border:1.5px solid var(--teal);color:var(--teal)}.btn.p{background:var(--plum);color:#fff}.btn.w{background:#fff;color:#0F6E56}.btn.g{background:none;border:1.5px solid #fff;color:#fff}.btn.d{background:none;border:1.5px solid var(--cor);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.h{font-size:24px;font-weight:800;color:var(--plum);margin:4px 0}.m{color:var(--mute);font-size:13px}.c{text-align:center}
.hero{background:var(--teal);color:#fff;text-align:center;display:flex;flex-direction:column;padding:28px 24px}.hero:before,.hero:after{content:"";margin:auto}.hero h1{letter-spacing:8px;font-size:34px;margin:8px 0}
.badge{background:#fff;border-radius:14px;padding:8px 12px;display:inline-block}.pg{display:block;width:150px;height:auto}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}.dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.moods{display:flex;justify-content:space-between;margin:10px 0}.mo{border:2px solid transparent;background:none;border-radius:14px;padding:3px;cursor:pointer;color:var(--ink);font-size:11px;font-weight:700;text-align:center}.mo.on{border-color:var(--plum);background:var(--card)}.mo svg{display:block;margin:0 auto 2px}
.talk{background:var(--teal);color:#fff;border-radius:18px;padding:16px;margin:10px 0}.talk b{font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;border-radius:14px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-height:72px}.tile b{display:block}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:11px;color:var(--mute);cursor:pointer}.tabs button.on{color:var(--teal);font-weight:800}.tabs button:before{content:"";display:block;width:10px;height:10px;border-radius:50%;background:var(--line);margin:0 auto 4px}.tabs button.on:before{background:var(--teal)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.msg{max-width:84%;padding:10px 13px;border-radius:16px;white-space:pre-wrap}.msg.a{background:var(--card);border:1px solid var(--line);align-self:flex-start}.msg.u{background:var(--teal);color:#fff;align-self:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 14px 8px}.chip{border:1.5px solid var(--teal);color:var(--teal);background:none;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}.chip.on{background:var(--teal);color:#fff}
.feel{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px}.feel button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer}.feel svg{display:block;margin:0 auto 3px}
.in{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}.in input{border-radius:99px;background:var(--bg)}.in button{border:0;background:var(--teal);color:#fff;border-radius:99px;padding:0 18px;font-weight:700}
.sc{background:var(--sx);border-color:var(--sun)}.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px;margin:5px 0;font:inherit;color:var(--ink);cursor:pointer}.opt.good{border-color:var(--teal);background:var(--tx)}.opt.bad{border-color:var(--cor);background:var(--cx)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.bar div{height:100%;background:var(--teal)}
.breathe{width:190px;height:190px;border-radius:50%;background:var(--teal);margin:34px auto;animation:b 8s ease-in-out infinite;display:grid;place-items:center;color:#fff;font-weight:800}@keyframes b{0%,100%{transform:scale(.6);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cal div{text-align:center;font-size:11px;color:var(--mute)}.cal i{display:block;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);margin:0 auto 2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;max-width:90%;text-align:center}
.notif{background:#222;color:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:13px}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--teal)}.sw.on:after{left:23px}
</style></head><body><div id="app"></div>
<script>
const T={"app": {"name": "ALLY", "tagline": "A safe space to be heard, to learn, and to find help.", "builtBy": "Built and powered by the PGM Foundation, a non-profit organisation."}, "common": {"back": "Back", "cancel": "Cancel", "continue": "Continue", "save": "Save", "delete": "Delete", "done": "Done", "comingSoon": "Coming soon", "comingSoonBody": "This is planned for a later version."}, "welcome": {"adult": "I'm 18 or older", "minor": "I'm under 18 (parent consent)", "footer": "Free. Private. Made in South Africa."}, "consent": {"title": "We need a grown-up's okay", "body": "Because you are under 18, a parent or guardian must say yes before you use ALLY. This protects your information under South African law (POPIA).", "phoneLabel": "Parent or guardian cell number", "phonePlaceholder": "e.g. 082 000 0000", "send": "Send approval code", "sentTo": "We sent a code to that number. Ask your parent or guardian to read it to you.", "codeLabel": "Approval code", "verify": "Verify", "wrong": "That code is not right. Please try again.", "error": "Something went wrong. Please try again.", "demo": "DEMO MODE: the real SMS service is not connected yet. Use the code 123456.", "help": "Cannot ask a parent or guardian? Talk to a teacher or school counsellor, or call Childline on 116 for free."}, "path": {"title": "What brings you here today?", "sub": "There are no wrong answers. Pick what fits.", "privacy": "Your answers stay private (POPIA).", "bullied": {"title": "I'm being bullied", "sub": "Get support and a plan"}, "hurt": {"title": "I hurt someone", "sub": "Understand it and make it right"}, "saw": {"title": "I saw it happen", "sub": "Learn how to step in safely"}, "vent": {"title": "I just need to talk", "sub": "Vent. Ally will listen."}}, "tabs": {"home": "Home", "ally": "Ally", "learn": "Learn", "calm": "Calm", "you": "You"}, "home": {"greeting": "Hi, friend", "how": "How are you feeling today?", "moodSaved": "Thanks for checking in.", "talkTitle": "Talk to Ally", "talkSub": "Private. Judgment-free. Any time.", "talkBtn": "Start chatting", "kindLabel": "TODAY'S KIND THOUGHT", "builtBy": "Built and powered by", "moods": {"great": "Great", "good": "Good", "okay": "Okay", "low": "Low", "rough": "Rough"}, "tiles": {"learn": {"title": "Learn", "sub": "Short lessons"}, "calm": {"title": "Calm corner", "sub": "Breathe and reset"}, "vault": {"title": "Evidence vault", "sub": "Private notes"}, "report": {"title": "Report helper", "sub": "Tell an adult"}}, "seeWeek": "See my week", "streak": "{{count}}-day check-in streak", "moodMsg": {"great": {"title": "That's wonderful", "body": "Hold on to this feeling. What helped today? Good moments are worth noticing."}, "good": {"title": "Glad you're doing well", "body": "Small good days matter. Maybe tell someone you trust about what went well."}, "okay": {"title": "Okay is okay", "body": "Not every day is bright or dark. If something is weighing on you, you can talk to Ally or try a calm minute."}, "low": {"title": "Thank you for being honest", "body": "Low days are hard, and you do not have to carry them alone. A calm minute, talking to Ally, or telling someone you trust can help."}, "rough": {"title": "I'm sorry today is rough", "body": "Thank you for telling me. You deserve support. Try a calm minute, talk to someone you trust, or talk to Ally. If you ever feel unsafe, tap SOS."}}, "actions": {"calm": "Try the Calm corner", "talk": "Talk to Ally", "tell": "Write a message to an adult"}}, "kind": ["You are not the things that were said about you.", "Asking for help is a sign of strength.", "You deserve to feel safe.", "Small steps count. Be kind to yourself today.", "Being left out says something about them, not about your worth.", "Your feelings are real and they matter."], "chat": {"title": "Ally", "banner": "Ally is a guided companion with pre-written replies. Not a person, not a therapist. In danger? Tap SOS.", "placeholder": "Type how you feel...", "send": "Send", "changeTopic": "Change topic", "chips": {"more": "Tell you more", "ideas": "Give me ideas", "adult": "Help me tell an adult"}, "intro": {"bullied": "Hi, I'm Ally. Thank you for trusting me with this. You deserve to feel safe. What has been happening?", "hurt": "Hi, I'm Ally. It takes courage to say that. You are not a bad person for wanting to understand and make it right. Can you tell me what happened?", "saw": "Hi, I'm Ally. Caring about what you saw matters. What did you notice, and how are you feeling about it?", "vent": "Hi, I'm Ally. I'm here and I'm listening. Take your time. What's on your mind?"}, "replies": {"cyber": "That sounds really painful, and it is not your fault. Online bullying can follow you everywhere. Saving screenshots and telling an adult you trust can help. Would you like some ideas for what to do next?", "physical": "I'm so sorry that is happening. Nobody has the right to hurt you. Your safety comes first. Is there a teacher, parent or adult you trust who you could tell today?", "hurt": "Thank you for being honest. Wanting to understand is a strong first step. What do you think was going on for you when it happened? There is no judgment here.", "saw": "Stepping in can feel scary. You can support the person quietly, tell a trusted adult, or report it. Which one feels doable for you?", "default": "I hear you. That sounds like a lot to carry. Can you tell me a bit more about what happened and how it made you feel?", "more": "Of course. Take your time. I'm listening.", "ideas": "Here are a few options:\n1) Tell an adult you trust.\n2) Save screenshots or notes with dates in the Evidence vault.\n3) Block or mute the person online.\n4) Use the Report helper to write a message to a teacher or parent.\nWhich would you like to try?", "adult": "A simple message could be: \"Hi, I need to talk to you about something that has been happening. Can we find a time?\" You can also tell a teacher, a school counsellor, or call Childline on 116. The Report helper can write a longer message for you.", "sexual": "I can't talk about that here. If someone is pressuring you for photos or touching you in ways that feel wrong, that is not okay and it is not your fault. Please tell an adult you trust, or call Childline on 116.", "feel": {"sad": "I'm sorry you feel sad. It is okay to feel this way. Would you like to tell me what happened, or try a calm minute together?", "angry": "Feeling angry makes sense when someone is unfair to you. A slow breath can help. What happened?", "scared": "That sounds scary, and you are not alone in this. Is someone near you who you trust? You can tell me what is frightening you.", "lonely": "Feeling lonely hurts. Thank you for telling me. Would you like to talk about it, or hear ideas for connecting with someone safe?", "confused": "It is okay to feel mixed up. We can go slowly. What part confuses you most?"}}, "feelingsTitle": "Tap how you feel (no typing needed)", "feelings": {"sad": "I feel sad", "angry": "I feel angry", "scared": "I feel scared", "lonely": "I feel lonely", "confused": "I feel confused"}}, "sos": {"title": "You matter.", "body": "It sounds like you might be in pain or in danger. Caring people are ready to talk with you right now.", "note": "Real people can help right now. Tap a number to call.", "back": "I'm safe. Go back", "calls": {"sadag": {"name": "SADAG suicide crisis line", "note": "24 hours"}, "childline": {"name": "Childline South Africa", "note": "Children and teens, toll-free"}, "emergency": {"name": "Police and emergencies", "note": "If you are in immediate danger"}, "lifeline": {"name": "Lifeline", "note": "Counselling"}, "gbv": {"name": "GBV Command Centre", "note": "Gender-based violence"}}}, "learn": {"title": "Learn", "progress": "{{done}} of {{total}} lessons done", "done": "Done", "start": "About 5 minutes", "markDone": "Mark as done", "completed": "Completed", "review": "General information, not legal advice or therapy.", "scenarioTitle": "What would you do?", "pickOne": "Tap an answer.", "helpful": "Helpful choice", "notBest": "Not the safest choice", "tryAnother": "You can try another answer."}, "lessons": {"bullying": {"title": "What is bullying?", "body": "Bullying is when someone keeps hurting, scaring or leaving out another person on purpose, and the person targeted finds it hard to make it stop. It can be physical, verbal, social (like leaving someone out) or online.\n\nOne-off arguments are not always bullying, but anything that makes you feel unsafe is worth telling someone about.\n\nBeing bullied is never your fault.", "scenario": {"q": "A classmate keeps making jokes about you in front of others. What would you do?", "o1": "Say something nasty back", "f1": "It is natural to be angry, but fighting back can make things worse and you could get in trouble. There are safer options.", "o2": "Tell a teacher or an adult you trust", "f2": "Yes. Telling a trusted adult is a strong step. It is not telling tales.", "o3": "Walk away and sit with a friend", "f3": "Good choice. Staying near people who care about you helps. Tell an adult too, so it can stop."}}, "why": {"title": "Why people bully", "body": "People bully for many reasons: wanting status, copying others, feeling insecure, or having been hurt themselves.\n\nReasons explain behaviour but never excuse it. The good news is that people can change, and learning empathy is the first step.\n\nIf you have hurt someone, you can make it right: stop, say sorry honestly, and ask a trusted adult how to repair things.", "scenario": {"q": "A friend says they bully others because it makes them feel strong. What could you say?", "o1": "It sounds like you feel small inside. Want to talk about it?", "f1": "Kind and curious. Reasons are worth understanding, even though they never excuse hurting someone.", "o2": "Do whatever you want.", "f2": "That leaves them alone with the problem, and the person being hurt too.", "o3": "Let's find an adult who can help you with those feelings.", "f3": "Great. Everyone deserves help with big feelings, and others deserve to be safe."}}, "cyber": {"title": "Cyberbullying and the law", "body": "Sending harmful messages or threats, or sharing someone's private or intimate images, can be a crime in South Africa under the Cybercrimes Act. The Protection from Harassment Act lets a person ask a court for a protection order, including for online harassment.\n\nWhat you can do: save screenshots with dates, block the person, and tell an adult you trust.\n\n(General information, not legal advice.)", "scenario": {"q": "Someone sends you a mean message and others share it in a group chat. What would you do?", "o1": "Take screenshots with dates, then tell an adult", "f1": "Yes. Evidence helps teachers, parents and the police act. Your Evidence vault can hold your notes.", "o2": "Delete everything and say nothing", "f2": "Deleting feels easier, but you lose proof and no one can help. Save it first and tell someone.", "o3": "Block the sender and report the messages in the app", "f3": "Good. Blocking and reporting help. Also tell an adult you trust."}}, "bystander": {"title": "Being a brave bystander", "body": "If you see bullying, you do not have to be a hero. Small actions matter.\n\n1) Check in with the person later and tell them you are there for them.\n2) Do not join in, laugh or share the content.\n3) Tell a trusted adult, such as a teacher or counsellor.\n4) If someone is in danger, get help straight away.\n\nIf stepping in feels unsafe, supporting the person quietly is still powerful.", "scenario": {"q": "You see a classmate being left out and teased. What would you do?", "o1": "Laugh along so you are not the next target", "f1": "That fear is common, but laughing makes it worse for them. There are safer ways to help.", "o2": "Check in with them later and tell a teacher", "f2": "Yes. A kind word and telling an adult can change everything.", "o3": "Invite them to sit with you", "f3": "Great. Including someone is a small action with a big effect."}}, "rights": {"title": "Your rights in South Africa", "body": "Everyone has the right to dignity and to be safe. Schools, workplaces and families should take bullying seriously.\n\nYou can tell a teacher, principal or school counsellor, and parents or guardians can follow up. Online harassment can be reported to the platform and to the police.\n\nChildline (116) can talk you through your options for free.\n\n(General information, not legal advice. Reviewed by an attorney before release.)", "scenario": {"q": "You are not sure if what is happening to you counts as bullying. What can you do?", "o1": "Talk to a school counsellor or call Childline on 116", "f1": "Yes. They can help you understand your options for free, and they will not judge you.", "o2": "Write down what happened and when, and show an adult", "f2": "Yes. Clear notes help adults understand and act.", "o3": "Decide it is probably nothing and keep quiet", "f3": "If it makes you feel unsafe or unhappy, it is worth telling someone. Your feelings count."}}}, "calm": {"title": "Calm corner", "sub": "Breathe with me", "in": "Breathe in...", "out": "Breathe out...", "hint": "Try this for one minute. You are safe in this moment.", "still": "Breathe in slowly for 4 seconds, then out slowly for 4 seconds. Repeat for one minute."}, "vault": {"title": "Evidence vault", "privacy": "Private. Stored only on this phone.", "empty": "No notes yet. Add dates and what happened, in your own words.", "add": "+ Add a note", "titleLabel": "Title", "textLabel": "What happened?", "titlePlaceholder": "e.g. Group chat, 12 Oct", "save": "Save note", "delete": "Delete this note?", "deleteBody": "This cannot be undone.", "photos": "Photo and screenshot attachments are planned for a later version.", "edit": "Edit", "update": "Save changes", "editing": "Editing note"}, "report": {"title": "Report helper", "who": "Who are you telling?", "what": "What has been happening?", "build": "Write my message", "draft": "Your draft (you can edit it before sending)", "share": "Share or copy", "note": "Ally helps you start the conversation. Sending is always your choice.", "whoOptions": {"teacher": "Teacher", "parent": "Parent or guardian", "principal": "Principal", "employer": "Manager or HR"}, "whatOptions": {"online": "Online messages or posts", "physical": "Being pushed, hit or hurt", "left_out": "Being left out or excluded", "threats": "Threats or scary behaviour"}, "templates": {"opening": "Hi, I need to talk to you about something that has been happening to me. I would like your help.", "list": "It includes:", "closing": "Please can we find a time to speak privately? I have saved some notes and screenshots. Thank you."}}, "you": {"title": "You", "language": "Language", "languageNote": "Other languages are coming. English is shown until a translation is added.", "about": "About ALLY", "aboutBody": "ALLY is a free, private app for anyone in South Africa affected by bullying. It is not a therapist or an emergency service.", "privacy": "Privacy", "privacyBody": "Your notes and mood check-ins stay on this phone. ALLY does not need your name. You can delete everything at any time.", "delete": "Delete all my data", "deleteConfirm": "Delete everything?", "deleteBody": "This removes your notes, check-ins and settings from this phone. It cannot be undone.", "version": "Version 1.0.0", "ai": "AI chat: planned for a later version.", "reminders": "Daily check-in reminder", "remindersBody": "One gentle reminder a day with a kind message. It stays on this phone.", "remindersTime": "Time", "remindersDenied": "Notifications are off for ALLY. Turn them on in your phone settings.", "feedback": "Send feedback", "history": "My week (mood history)"}, "history": {"title": "My week", "sub": "How you felt over the last 14 days.", "empty": "No check-ins yet. Tap a mood on Home to start.", "none": "No check-in", "summary": "{{count}} of the last 7 days felt low or rough.", "note": "Your check-ins stay on this phone."}, "support"
